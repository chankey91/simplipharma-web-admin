# Optional: run Typesense on your own Linux host (not used by Firebase deploy).
# Server image pinned to current stable: typesense/typesense:30.1
# NPM client: `typesense@^3.0.5` in package.json — run `npm install typesense@latest` in this folder to refresh.
#
# Usage:
#   cd functions
#   echo "TS_API_KEY=$(openssl rand -hex 24)" >> .env
#   docker compose -f docker-compose.typesense.yml --env-file .env up -d
#
# Production: put Nginx+TLS in front, raise ulimits (prevents "Too many open files"),
# and run scripts/typesense-healthcheck.sh via cron.

services:
  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "${TS_API_KEY:?Set TS_API_KEY in .env}"
      - "--listen-port"
      - "8108"
      - "--enable-cors"

volumes:
  typesense-data:
